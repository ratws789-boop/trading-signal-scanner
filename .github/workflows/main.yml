name: Trading Signal Scanner Test

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run scanner
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1400,
                height: 1000
              }
            });

            const url = 'https://ratws789-boop.github.io/trading-signal-scanner/';

            console.log('Opening scanner:', url);

            await page.goto(url, {
              waitUntil: 'domcontentloaded',
              timeout: 120000
            });

            await page.waitForTimeout(5000);

            console.log('Selecting Method 3...');

            await page.selectOption('#strategyMethod', '3');

            console.log('Starting Scan Now...');

            await page.locator('#scanBtn').click();

            await page.waitForFunction(
              () => {
                const btn = document.querySelector('#scanBtn');
                return btn && btn.textContent.includes('Scan Now');
              },
              null,
              {
                timeout: 15 * 60 * 1000
              }
            );

            console.log('Scan completed.');

            const signals = await page.locator('#cards .card').evaluateAll(cards => {
              return cards.map(card => ({
                symbol: card.querySelector('.sym')?.textContent?.trim() || '',
                text: card.innerText
              }));
            });

            console.log('================================');
            console.log('SIGNALS FOUND:', signals.length);
            console.log('================================');

            for (const signal of signals) {
              console.log('');
              console.log('SYMBOL:', signal.symbol);
              console.log(signal.text);
              console.log('--------------------------------');
            }

            if (signals.length === 0) {
              console.log('No confirmed signals found.');
            }

            await browser.close();
          })();
          NODE
